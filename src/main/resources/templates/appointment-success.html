<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號完成 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        .card { background: #F8FAFC; padding: 24px; border-radius: 10px; margin-top: 20px; }
        .card p { margin: 14px 0; }
        .label { font-weight: bold; color: #0F2443; }
        .nav { margin-top: 24px; }
        .nav a { display: inline-block; margin-right: 12px; color: #14B8A6; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>掛號完成</h1>
    <div class="card">
        <p><span class="label">病歷號：</span><span th:text="${appointment.chartNo}">TEST00001</span></p>
        <p><span class="label">醫師：</span><span th:text="${doctor.name}">陳志明醫師</span> (<span th:text="${doctor.department}">家醫科</span>)</p>
        <p><span class="label">日期：</span><span th:text="${appointment.apptDate}">2024-05-10</span></p>
        <p><span class="label">時段：</span><span th:text="${appointment.timeSlot}">上午門診</span></p>
    </div>
    <div class="nav">
        <a th:href="@{/}">回首頁</a>
        <a th:href="@{/doctors}">回醫師清單</a>
        <a th:href="@{/appointment/new}">重新掛號</a>
    </div>
</body>
</html>
