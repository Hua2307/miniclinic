<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #14B8A6; padding-bottom: 12px; }
        h1 { color: #0F2443; margin: 0; }
        .logout-form { margin: 0; }
        .logout-form button { background: #94A3B8; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        .status-BOOKED    { color: #F59E0B; font-weight: bold; }
        .status-COMPLETED { color: #10B981; font-weight: bold; }
        .status-CANCELLED { color: #94A3B8; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 12px; margin: 20px 0; }
        .stats-card { padding: 16px; border: 1px solid #E2E8F0; border-radius: 10px; background: #F8FAFC; }
        .stats-card h3 { margin: 0 0 8px; font-size: 14px; color: #334155; }
        .stats-card p { margin: 0; font-size: 24px; font-weight: bold; color: #0F2443; }
        .by-status { display: flex; gap: 12px; margin-top: 12px; }
        .by-status span { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
        .by-status .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-booked { background: #F59E0B; }
        .dot-completed { background: #10B981; }
        .dot-cancelled { background: #94A3B8; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Dashboard</h1>
            <p>歡迎，<span th:text="${doctor.name}"></span>（<span th:text="${doctor.department}"></span>）</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="/password" style="display:inline-block; padding: 8px 14px; background:#0f766e; color:#fff; text-decoration:none; border-radius:4px;">修改密碼</a>
            <form class="logout-form" th:action="@{/logout}" method="post">
                <button type="submit">登出</button>
            </form>
        </div>
    </header>

    <section class="stats-grid">
        <div class="stats-card">
            <h3>醫師總數</h3>
            <p th:text="${totalDoctors}">0</p>
        </div>
        <div class="stats-card">
            <h3>病患總數</h3>
            <p th:text="${totalPatients}">0</p>
        </div>
        <div class="stats-card">
            <h3>掛號總數</h3>
            <p th:text="${totalAppointments}">0</p>
        </div>
    </section>

    <section class="stats-grid">
        <div class="stats-card" style="grid-column: span 3;">
            <h3>狀態統計</h3>
            <div class="by-status">
                <span><span class="dot dot-booked"></span>BOOKED：<strong th:text="${byStatus.BOOKED}">0</strong></span>
                <span><span class="dot dot-completed"></span>COMPLETED：<strong th:text="${byStatus.COMPLETED}">0</strong></span>
                <span><span class="dot dot-cancelled"></span>CANCELLED：<strong th:text="${byStatus.CANCELLED}">0</strong></span>
            </div>
            <div style="margin-top:12px;">
                <canvas id="statusChart" width="600" height="160"></canvas>
            </div>
        </div>
    </section>

    <h2 th:text="|今日掛號：${today}|"></h2>

    <p th:if="${appointments.isEmpty()}">今日沒有掛號。</p>

    <table th:unless="${appointments.isEmpty()}">
        <thead>
            <tr>
                <th>時段</th>
                <th>病患</th>
                <th>病歷號</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.timeSlot}">AM</td>
                <td th:text="${appt.patient.name}">測試病患甲</td>
                <td th:text="${appt.patient.chartNo}">TEST00001</td>
                <td>
                    <span th:text="${appt.status}"
                        th:class="${'status-' + appt.status}">BOOKED</span>
                    <button type="button"
                        th:if="${appt.status == 'BOOKED'}"
                        th:attr="data-id=${appt.apptId}"
                        onclick="completeAppointment(this)"
                        style="margin-left:8px; padding:4px 8px; background:#10b981; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                        完成
                    </button>
                    <button type="button"
                        th:if="${appt.status == 'BOOKED'}"
                        th:attr="data-id=${appt.apptId}"
                        onclick="cancelAppointment(this)"
                        style="margin-left:8px; padding:4px 8px; background:#ef4444; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                        取消
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
        <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}">← 回首頁</a>
    </p>
        <script>
            async function completeAppointment(btn) {
                const id = btn.getAttribute('data-id');
                if (!id) return;
                if (!confirm('確定要標記這筆掛號為完成嗎？')) return;
                try {
                    const res = await fetch('/api/appointments/' + id + '/status', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'COMPLETED' })
                    });
                    if (res.ok) {
                        location.reload();
                    } else {
                        const text = await res.text();
                        alert('更新失敗：' + res.status + ' ' + text);
                    }
                } catch (e) {
                    alert('網路錯誤：' + e);
                }
            }

            async function cancelAppointment(btn) {
                const id = btn.getAttribute('data-id');
                if (!id) return;
                if (!confirm('確定要取消這筆掛號嗎？')) return;
                try {
                    const res = await fetch('/api/appointments/' + id + '/status', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'CANCELLED' })
                    });
                    if (res.ok) {
                        location.reload();
                    } else {
                        const text = await res.text();
                        alert('取消失敗：' + res.status + ' ' + text);
                    }
                } catch (e) {
                    alert('網路錯誤：' + e);
                }
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            var booked = /*[[${byStatus.BOOKED}]]*/ 0;
            var completed = /*[[${byStatus.COMPLETED}]]*/ 0;
            var cancelled = /*[[${byStatus.CANCELLED}]]*/ 0;

            const ctx = document.getElementById('statusChart');
            if (ctx) {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['BOOKED','COMPLETED','CANCELLED'],
                        datasets: [{
                            label: '數量',
                            data: [booked, completed, cancelled],
                            backgroundColor: ['#F59E0B','#10B981','#94A3B8']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
            /*]]>*/
        </script>
