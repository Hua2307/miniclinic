<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; margin-bottom: 24px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #5EEAD4; }
        .stats { display: grid; gap: 16px; margin-top: 24px; }
        .card { background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 12px; padding: 18px; }
        .card h2 { margin: 0 0 12px; color: #0F2443; }
        .card p { margin: 0; font-size: 1.3rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px 10px; border: 1px solid #CBD5E1; text-align: left; }
        th { background: #0F2443; color: white; }
    </style>
</head>
<body>
    <h1>掛號統計</h1>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointment/new}">線上掛號</a>
        <a th:href="@{/appointments}">掛號記錄</a>
        <a th:href="@{/stats}">掛號統計</a>
    </nav>
    <section class="stats">
        <div class="card">
            <h2>總計資訊</h2>
            <p>醫師總數：<strong th:text="${doctorCount}">0</strong></p>
            <p>病患總數：<strong th:text="${patientCount}">0</strong></p>
            <p>掛號總數：<strong th:text="${appointmentCount}">0</strong></p>
        </div>
        <div class="card">
            <h2>依科別分組掛號數</h2>
            <table>
                <thead>
                    <tr>
                        <th>科別</th>
                        <th>掛號數</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${appointmentsByDepartment}">
                        <td th:text="${entry.department}"></td>
                        <td th:text="${entry.count}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>
</html>
